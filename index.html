<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
    --text:#f2f4f8; --muted:#8b93a5; --green:#2fbf71; --green-d:#1f8f53;
    --red:#ef5a5a; --red-d:#c03e3e; --accent:#5b8cff; --warn:#f2b84b;
  }
  :root{--accent-bg:#4970cc;--accent-text:#5b8cff}
  body.light{--bg:#f3f4f7;--card:#ffffff;--card2:#eceef3;--line:#e0e3ea;--text:#15171c;--muted:#5f6779;
    --green:#1f7c49;--warn:#94600a;--red:#c53a3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
       calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px)}
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 16px}
  .date{color:var(--muted);font-size:14px;text-transform:capitalize}
  h1{margin:2px 0 0;font-size:clamp(22px,7vw,30px);letter-spacing:-.5px;overflow-wrap:anywhere}
  .clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
  .status{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 10px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
  .punch-btn{display:block;width:100%;margin:16px 0 4px;border:0;border-radius:18px;padding:22px 16px;
    font-size:22px;font-weight:700;color:#fff;background:var(--accent-bg);cursor:pointer;
    transition:transform .08s, background .2s}
  .punch-btn:active{transform:scale(.98)}
  .punch-btn.out{background:var(--red)}
  .punch-btn small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:4px}
  .punch-btn:disabled{opacity:.5}
  .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
  .bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0 8px}
  .bar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
  .bar>div.done{background:var(--green)}
  .sub{color:var(--muted);font-size:14px}
  .sub b{color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .stat .v{font-size:clamp(14px,4.4vw,19px);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .row:first-child{border-top:0}
  .row.pause{padding:6px 0;border-top:1px dashed var(--line)}
  .row .t{font-size:16px}
  .row .d{color:var(--muted);font-size:14px}
  .live{color:var(--green)}
  h2{font-size:18px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
  .link{background:none;border:0;color:var(--accent-text);font-weight:600;font-size:15px;cursor:pointer;padding:4px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .day-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
  .day-h .n{font-weight:600;text-transform:capitalize}
  .day-h .tot{font-weight:700;font-variant-numeric:tabular-nums}
  .day-h .tot.over{color:var(--green)} .day-h .tot.under{color:var(--warn)}
  .day-b{padding:0 16px 8px;display:none}
  .day.open .day-b{display:block}
  .edit{background:var(--card2);border:0;color:var(--text);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
  .month-tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
  .month-tabs button{flex:none;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;text-transform:capitalize}
  .month-tabs button.sel{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
  .empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:15px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .tool{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:15px;cursor:pointer}
  .note{font-size:13px;color:var(--warn);text-align:center;margin:8px 0}
  /* sheet */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .veil.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);border-top:1px solid var(--line)}
  .sheet{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet h3{margin:0 0 14px;font-size:19px}
  .sheet h4{margin:18px 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
  .sw.sel{border-color:var(--text)}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
  .seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:10px;font-size:15px;cursor:pointer}
  .seg button.sel{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .two>div,.field{min-width:0}
  .field input[type=date],.field input[type=time]{min-width:0;max-width:100%;display:block}
  .pay{display:flex;justify-content:space-between;align-items:center}
  .pay .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .info h4{margin:18px 0 6px;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0}
  .info p,.info li{color:var(--muted);font-size:15px;line-height:1.45;margin:0 0 6px}
  .info ul{padding-left:18px;margin:0}
  .info b{color:var(--text)}
  .chart{display:flex;gap:2px;align-items:flex-end;height:96px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 4px;margin-bottom:10px}
  .cb{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .cs{flex:1;position:relative;display:flex;flex-direction:column-reverse}
  .cw{background:var(--accent-bg);border-radius:3px 3px 0 0}
  .cw.over{background:var(--green)}
  .ca{background:var(--muted);opacity:.55}
  .ct{position:absolute;left:-1px;right:-1px;height:2px;background:var(--text);opacity:.25}
  .cb.today .cl{color:var(--text);font-weight:700}
  .cl{font-size:10px;color:var(--muted);text-align:center;height:13px;line-height:13px}
  .tags{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:none;margin-top:2px}
  .day-actions{padding:6px 0 4px;border-top:1px solid var(--line)}
  .day-actions .link{padding:6px 0;font-size:14px}
  .still{background:var(--card2);border:1px solid var(--warn);border-radius:14px;padding:14px;margin-top:14px}
  .mtot{color:var(--muted);font-size:14px;margin:0 4px 10px}
  .field{margin-bottom:12px}
  .field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  .field textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:17px;font-family:inherit;resize:vertical}
  .field input:disabled{opacity:.6}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .week label{text-align:center;margin-bottom:4px}
  .week input{padding:10px 2px!important;text-align:center;font-size:16px!important}
  .field input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:17px;font-family:inherit;-webkit-appearance:none;min-height:46px}
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
  .btn.p{background:var(--accent-bg);color:#fff}
  .btn.s{background:var(--card2);color:var(--text)}
  .btn.d{background:transparent;color:var(--red);border:1px solid var(--red-d)}
  .err{color:var(--red);font-size:14px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(30px);
    background:var(--text);color:var(--bg);padding:11px 18px;box-shadow:0 4px 16px rgba(0,0,0,.25);border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="updBar" hidden style="position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:var(--accent)">
    <div><b>Nuova versione disponibile</b><div class="sub" id="updTxt"></div></div>
    <button class="btn p" id="updBtn" style="flex:none;padding:12px 18px">Aggiorna</button>
  </div>
  <header>
    <div>
      <div class="date" id="today"></div>
      <h1 id="appName">Timbrature</h1>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Caricamento…</span></div>
    <div class="still" id="still" hidden>
      <div><b>Sei ancora al lavoro?</b><div class="sub" id="stillTxt"></div></div>
      <div class="btns" style="margin-top:10px"><button class="btn s" id="stillYes">Sì, continuo</button><button class="btn p" id="stillNo"></button></div>
    </div>
    <button class="punch-btn" id="punchBtn" disabled>Timbra entrata</button>
  </div>

  <div class="card">
    <div class="label">Oggi</div>
    <div class="big" id="todayTot">0h 00m</div>
    <div class="bar"><div id="todayBar" style="width:0%"></div></div>
    <div class="sub" id="todayMsg"></div>
    <div id="todayList" style="margin-top:10px"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Settimana</div><div class="v" id="wTot">0h 00m</div></div>
    <div class="stat"><div class="label">Mese</div><div class="v" id="mTot">0h 00m</div></div>
    <div class="stat"><div class="label">Saldo mese</div><div class="v" id="mBal">0h 00m</div></div>
  </div>

  <div class="card" id="payCard" hidden>
    <div class="pay"><div><div class="label">Stima lorda del mese</div><div class="sub" id="payDet"></div></div><div class="v" id="payTot"></div></div>
  </div>

  <div class="card" id="bkCard" hidden style="border-color:var(--warn)">
    <div><b>💾 <span id="bkTitle"></span></b><div class="sub" id="bkTxt"></div></div>
    <div class="btns" style="margin-top:12px"><button class="btn s" id="bkLater">Più tardi</button><button class="btn p" id="bkNow">Fai backup ora</button></div>
  </div>

  <div class="note" id="note" hidden></div>

  <h2>Storico <button class="link" id="addBtn">+ Aggiungi</button></h2>
  <div class="month-tabs" id="months"></div>
  <div class="mtot" id="histTot"></div>
  <div id="chart"></div>
  <div id="history"></div>

  <div class="tools">
    <button class="tool" id="exportBtn">Esporta mese</button>
    <button class="tool" id="settingsBtn">Impostazioni</button>
    <button class="tool" id="backupBtn">Backup / ripristino</button>
    <button class="tool" id="infoBtn">Info e istruzioni</button>
  </div>
</div>

<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:22px">Versione <span id="ver"></span> · <button class="link" id="verChk" style="font-size:12px;font-weight:600;padding:0">Controlla aggiornamenti</button></div>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const keyToDate = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dur = ms => {
    const neg = ms < 0; ms = Math.abs(ms);
    const m = Math.floor(ms / 60000);
    return `${neg ? "−" : ""}${Math.floor(m/60)}h ${pad(m%60)}m`;
  };
  const num1 = v => String(v).replace(".", ",");
  const signed = ms => (ms >= 0 ? "+" : "") + dur(ms);
  const fmtDay = k => keyToDate(k).toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long" });
  const fmtMonth = k => keyToDate(k + "-01").toLocaleDateString("it-IT", { month:"long", year:"numeric" });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };

  // ---------- state ----------
  let days = {};             // "YYYY-MM-DD" -> { p: [{i: ms, o: ms|null}] }
  const DEFAULTS = { target: 8, week: null, round: 0, name: "Timbrature", color: "#5b8cff", theme: "dark", pay: 0, ot: 25, otN: 0, otF: 0 };
  const WD = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
  const ABS = { ferie: "Ferie", malattia: "Malattia", permesso: "Permesso", festivo: "Festivo" };
  const ABS_ICON = { ferie: "🏖️", malattia: "🤒", permesso: "📄", festivo: "🎉" };
  const COLORS = ["#5b8cff", "#2fbf71", "#9b6bff", "#ff8a3d", "#ff5c8a", "#22b8cf"];
  let settings = Object.assign({}, DEFAULTS);
  let selMonth = dayKey(new Date()).slice(0, 7);
  let openDays = new Set([dayKey(new Date())]);
  let ready = false;

  // ---------- storage (solo sul telefono) ----------
  const LS_KEY = "timbrature.v1";
  let storageOk = true;
  const store = {
    load() {
      try {
        const j = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
        days = {};
        for (const [dk, v] of Object.entries(j.days || {})) { const c = cleanDay(dk, v); if (c) days[dk] = c; }
        settings = Object.assign({}, DEFAULTS, j.settings || {});
      }
      catch (e) { storageOk = false; }
    },
    save() {
      for (const k of Object.keys(days)) if (!hasData(k)) delete days[k];
      try { localStorage.setItem(LS_KEY, JSON.stringify({ days, settings, saved: Date.now() })); }
      catch (e) { storageOk = false; showNote("Impossibile salvare i dati: disattiva la navigazione privata."); }
    },
    async writeDay() { this.save(); },
    async writeSettings() { this.save(); }
  };

  function initStore() {
    store.load();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    if (!storageOk) showNote("Impossibile salvare i dati: disattiva la navigazione privata.");
    const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (!standalone) showNote("Consiglio: tocca Condividi → \"Aggiungi alla schermata Home\" e usa l'app da lì.");
    ready = true;
    render();
  }

  function showNote(t) { const n = $("note"); n.textContent = t; n.hidden = false; }
  function hideNote() { $("note").hidden = true; }

  // ---------- calculations ----------
  // conta minuti interi (08:00:50 → 08:00), così i totali coincidono con l'Excel che usa HH:MM
  const toMin = t => Math.floor(t / 60000) * 60000;
  // arrotondamento: entrata al blocco successivo, uscita al precedente (come molti badge aziendali)
  function eff(p, now) {
    let i = toMin(p.i), o = toMin(p.o ?? now);
    const r = (Number(settings.round) || 0) * 60000;
    if (r) { i = Math.ceil(i / r) * r; if (p.o != null) o = Math.floor(o / r) * r; if (o < i) o = i; }
    return { i, o };
  }
  const punchMs = (p, now) => { const e = eff(p, now); return Math.max(0, e.o - e.i); };
  const dayMs = (k, now) => (days[k]?.p || []).reduce((s, p) => s + punchMs(p, now), 0);
  const absMs = k => days[k]?.t ? (Number(days[k].h) || 0) * 3600000 : 0;
  const hasData = k => !!days[k] && (days[k].p.length > 0 || !!days[k].t || !!days[k].n);
  function cleanDay(dk, v) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk) || !v || typeof v !== "object") return null;
    const p = (Array.isArray(v.p) ? v.p : []).filter(x => x && Number.isFinite(x.i) && (x.o == null || Number.isFinite(x.o)))
                 .map(x => ({ i: x.i, o: x.o ?? null })).sort((a, b) => a.i - b.i);
    const d = { p };
    if (ABS[v.t]) { d.t = v.t; d.h = Math.min(24, Math.max(0, Number(v.h) || 0)); }
    if (typeof v.n === "string" && v.n.trim()) d.n = v.n.trim().slice(0, 300);
    return (d.p.length || d.t || d.n) ? d : null;
  }
  // festività nazionali italiane
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  const holCache = {};
  function holidayName(k) {
    const y = +k.slice(0, 4);
    if (!holCache[y]) {
      const pm = easter(y); pm.setDate(pm.getDate() + 1);
      holCache[y] = { [`${y}-01-01`]: "Capodanno", [`${y}-01-06`]: "Epifania", [dayKey(pm)]: "Pasquetta", [`${y}-04-25`]: "Festa della Liberazione",
        [`${y}-05-01`]: "Festa del Lavoro", [`${y}-06-02`]: "Festa della Repubblica", [`${y}-08-15`]: "Ferragosto", [`${y}-11-01`]: "Ognissanti",
        [`${y}-12-08`]: "Immacolata", [`${y}-12-25`]: "Natale", [`${y}-12-26`]: "Santo Stefano" };
    }
    return holCache[y][k] || null;
  }
  const isFestive = k => keyToDate(k).getDay() === 0 || !!holidayName(k) || days[k]?.t === "festivo";
  function weekHours() {
    const w = settings.week, t = Number(settings.target) || 0;
    return Array.isArray(w) && w.length === 7 ? w.map(x => Number(x) || 0) : [t, t, t, t, t, t, t];
  }
  const dayTargetH = k => holidayName(k) ? 0 : weekHours()[(keyToDate(k).getDay() + 6) % 7];
  const targetFor = k => dayTargetH(k) * 3600000;
  // minuti notturni (22–06) e festivi/domenicali di un turno
  function splitMs(p, now) {
    const e = eff(p, now); let night = 0, fest = 0;
    const start = keyToDate(dayKey(new Date(e.i))); start.setDate(start.getDate() - 1);
    for (const d = start; d.getTime() < e.o; d.setDate(d.getDate() + 1)) {
      const k = dayKey(d), d0 = d.getTime(), dn = new Date(d); dn.setDate(dn.getDate() + 1); const d1 = dn.getTime();
      const ov = (a, b) => Math.max(0, Math.min(b, e.o) - Math.max(a, e.i));
      const n1 = new Date(d); n1.setHours(6, 0, 0, 0); const n2 = new Date(d); n2.setHours(22, 0, 0, 0);
      night += ov(d0, n1.getTime()) + ov(n2.getTime(), d1);
      if (isFestive(k)) fest += ov(d0, d1);
    }
    return { night, fest };
  }
  const sortPunches = arr => arr.sort((a, b) => a.i - b.i);
  function findOpen() {
    for (const k of Object.keys(days).sort().reverse()) {
      const idx = days[k].p.findIndex(p => p.o == null);
      if (idx >= 0) return { k, idx };
    }
    return null;
  }

  // ---------- actions ----------
  const MAX_SHIFT = 16 * 3600000;     // turno massimo plausibile
  const FORGOT = 14 * 3600000;        // oltre: probabile uscita dimenticata
  let lastTap = 0;
  async function punch() {
    const now = Date.now();
    if (now - lastTap < 5000) { toast("Hai appena timbrato"); return; }
    const open = findOpen();
    if (open && now - days[open.k].p[open.idx].i > FORGOT) { openPunchSheet(open.k, open.idx, true); return; }
    lastTap = now;
    let k;
    if (open) {
      k = open.k;
      days[k].p[open.idx].o = now;
      toast(`Uscita timbrata alle ${hm(now)}`);
    } else {
      k = dayKey(new Date(now));
      days[k] = days[k] || { p: [] };
      days[k].p.push({ i: now, o: null });
      sortPunches(days[k].p);
      toast(`${days[k].p.length > 1 ? "Rientro" : "Entrata"} timbrato alle ${hm(now)}`);
      openDays.add(k);
    }
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
    render();
    try { await store.writeDay(k); } catch (e) { toast("Errore nel salvataggio, riprova"); }
  }

  // ---------- "Sei ancora al lavoro?" ----------
  // orario di uscita abituale = mediana dell'ultima uscita dei giorni recenti (servono almeno 3 giorni)
  function usualExitMin() {
    const today = dayKey(new Date()), mins = [];
    for (const k of Object.keys(days).sort().reverse()) {
      if (k >= today) continue;
      const ps = days[k].p; if (!ps.length) continue;
      const last = ps[ps.length - 1]; if (last.o == null || dayKey(new Date(last.o)) !== k) continue;
      const d = new Date(last.o); mins.push(d.getHours() * 60 + d.getMinutes());
      if (mins.length >= 15) break;
    }
    if (mins.length < 3) return null;
    mins.sort((a, b) => a - b); return mins[Math.floor(mins.length / 2)];
  }
  let stillDismissed = (() => { try { return +localStorage.getItem("timbrature.still") || 0; } catch (e) { return 0; } })();
  function renderStill(open, now) {
    const box = $("still");
    if (!open || open.k !== dayKey(new Date(now))) { box.hidden = true; return; }
    const p = days[open.k].p[open.idx], u = usualExitMin();
    const at = keyToDate(open.k); at.setHours(0, u ?? 0, 0, 0);
    if (u == null || stillDismissed === p.i || at.getTime() <= p.i || now < at.getTime() + 45 * 60000) { box.hidden = true; return; }
    box.hidden = false;
    $("stillTxt").textContent = `Di solito esci verso le ${hm(at)}. Se hai dimenticato di timbrare, registra l'uscita a quell'ora.`;
    $("stillNo").textContent = `Sono uscito alle ${hm(at)}`;
    $("stillNo").onclick = () => { p.o = at.getTime(); store.save(); render(); toast(`Uscita registrata alle ${hm(at)}`); };
    $("stillYes").onclick = () => { stillDismissed = p.i; try { localStorage.setItem("timbrature.still", String(p.i)); } catch (e) {} render(); };
  }

  // ---------- aspetto ----------
  const eur = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
  function applyLook() {
    const light = settings.theme === "light" || (settings.theme === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
    document.body.classList.toggle("light", light);
    const acc = COLORS.includes(settings.color) ? settings.color : DEFAULTS.color;
    const shade = (h, k) => "#" + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0")).join("");
    const rs = document.documentElement.style;
    rs.setProperty("--accent", acc);
    rs.setProperty("--accent-bg", shade(acc, 0.8));              // sfondo con testo bianco leggibile
    rs.setProperty("--accent-text", light ? shade(acc, 0.72) : acc); // testo colorato leggibile
    const name = (settings.name || "").trim() || DEFAULTS.name;
    $("appName").textContent = name; document.title = name;
    const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = light ? "#f3f4f7" : "#0f1115";
  }
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { applyLook(); }); } catch (e) {}

  // riepilogo di un mese: ore ordinarie, straordinari, notturne, festive, assenze e stima lorda
  function monthStats(month, now) {
    const r = { worked: 0, ord: 0, ot: 0, night: 0, fest: 0, absH: 0, abs: {}, days: 0, total: 0 };
    for (const k of Object.keys(days)) {
      if (!k.startsWith(month) || !hasData(k)) continue;
      const w = dayMs(k, now), tg = targetFor(k), a = absMs(k);
      if (w || a) r.days++;
      r.worked += w;
      const ordW = Math.min(w, Math.max(0, tg - a));
      r.ord += ordW; r.ot += w - ordW;
      if (days[k].t) { r.absH += a; r.abs[days[k].t] = (r.abs[days[k].t] || 0) + a; }
      for (const p of days[k].p) { const sp = splitMs(p, now); r.night += sp.night; r.fest += sp.fest; }
    }
    const pay = Number(settings.pay) || 0, H = 3600000;
    r.total = (r.ord + r.absH) / H * pay + r.ot / H * pay * (1 + (Number(settings.ot) || 0) / 100)
            + r.night / H * pay * (Number(settings.otN) || 0) / 100 + r.fest / H * pay * (Number(settings.otF) || 0) / 100;
    return r;
  }

  // ---------- rendering ----------
  function render() {
    applyLook();
    const now = Date.now();
    const today = dayKey(new Date(now));
    const open = findOpen();

    // status + button
    const btn = $("punchBtn");
    btn.disabled = !ready;
    if (open) {
      const p = days[open.k].p[open.idx];
      $("dot").classList.add("on");
      if (now - p.i > FORGOT) {
        $("dot").classList.remove("on");
        $("statusTxt").innerHTML = `<span style="color:var(--warn)">Uscita dimenticata? Turno aperto dalle ${hm(p.i)} di ${esc(fmtDay(open.k))}</span>`;
        btn.className = "punch-btn out";
        btn.innerHTML = `Inserisci l'ora di uscita<small>Poi potrai timbrare l'entrata di oggi</small>`;
      } else {
      $("statusTxt").innerHTML = `In servizio dalle <b style="color:var(--text)">${hm(p.i)}</b>${open.k !== today ? " (" + esc(fmtDay(open.k)) + ")" : ""} · ${dur(now - p.i)}`;
      btn.className = "punch-btn out";
      btn.innerHTML = `Timbra uscita<small>Turno in corso da ${dur(now - p.i)}</small>`;
      }
    } else {
      $("dot").classList.remove("on");
      const tp = days[today]?.p || [];
      const last = tp.length ? tp[tp.length - 1] : null;
      btn.className = "punch-btn";
      if (ready && last && last.o != null && last.o <= now && now - last.o < 3 * 3600000) {
        $("statusTxt").innerHTML = `In pausa dalle <b style="color:var(--text)">${hm(last.o)}</b> · ${dur(now - last.o)}`;
        btn.innerHTML = `Timbra rientro<small>Riprendi il lavoro dopo la pausa</small>`;
      } else {
        $("statusTxt").innerHTML = !ready ? "Caricamento…" : (last && last.o != null
          ? `Fuori servizio · uscito alle <b style="color:var(--text)">${hm(last.o)}</b>` : "Fuori servizio");
        btn.innerHTML = `Timbra entrata<small>Inizia il turno ora</small>`;
      }
    }

    renderStill(open, now);

    // today
    const tMs = dayMs(today, now), tgt = Math.max(0, targetFor(today) - absMs(today)), tgH = num1(+(tgt / 3600000).toFixed(2));
    $("todayTot").textContent = dur(tMs);
    const pct = tgt ? Math.min(100, tMs / tgt * 100) : 0;
    const bar = $("todayBar"); bar.style.width = pct + "%"; bar.classList.toggle("done", tgt && tMs >= tgt);
    if (open && open.k !== today) {
      const p = days[open.k].p[open.idx];
      $("todayMsg").innerHTML = `Turno iniziato ${esc(fmtDay(open.k))}: <b>${dur(punchMs(p, now))}</b> (contato su quel giorno)`;
    }
    else if (days[today]?.t && !tMs) $("todayMsg").innerHTML = `Oggi: <b>${ABS_ICON[days[today].t]} ${ABS[days[today].t]}</b> (${num1(days[today].h)}h)`;
    else if (!tgt) $("todayMsg").innerHTML = tMs ? `${esc(holidayName(today) || "Giorno di riposo")}: tutte le ore sono <b>straordinario</b>` : esc(holidayName(today) || "Giorno di riposo");
    else if (tMs >= tgt) $("todayMsg").innerHTML = `Obiettivo di ${tgH}h raggiunto · <b>${signed(tMs - tgt)}</b> di straordinario`;
    else {
      let msg = `Mancano <b>${dur(tgt - tMs)}</b> alle ${tgH}h`;
      if (open) { const end = now + (tgt - tMs); msg += ` · uscita prevista alle <b>${hm(end)}</b>`; }
      $("todayMsg").innerHTML = msg;
    }
    $("todayList").innerHTML = punchRows(today, now) || "";

    // week / month
    const d = new Date(now);
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    let wMs = 0;
    for (let i = 0; i < 7; i++) { const x = new Date(monday); x.setDate(monday.getDate() + i); wMs += dayMs(dayKey(x), now); }
    $("wTot").textContent = dur(wMs);
    const mKey = today.slice(0, 7);
    const mDays = Object.keys(days).filter(k => k.startsWith(mKey) && (days[k].p.length || days[k].t));
    const mMs = mDays.reduce((s, k) => s + dayMs(k, now), 0);
    $("mTot").textContent = dur(mMs);
    // giorni passati: ore lavorate + assenze - obiettivo; oggi: solo l'eventuale straordinario; giorni futuri esclusi
    const bal = mDays.reduce((s, k) => { const v = dayMs(k, now) + absMs(k) - targetFor(k);
      return k < today ? s + v : k === today ? s + Math.max(0, v) : s; }, 0);
    const balEl = $("mBal"); balEl.textContent = signed(bal);
    balEl.style.color = bal >= 0 ? "var(--green)" : "var(--warn)";

    const pc = $("payCard");
    if (Number(settings.pay) > 0) {
      const mp = monthStats(mKey, now);
      pc.hidden = false;
      $("payTot").textContent = eur.format(mp.total);
      const parts = [`${dur(mp.ord)} ordinarie`, `${dur(mp.ot)} straord.`];
      if (mp.absH) parts.push(`${dur(mp.absH)} assenze pagate`);
      if (mp.night && Number(settings.otN)) parts.push(`${dur(mp.night)} notturne`);
      if (mp.fest && Number(settings.otF)) parts.push(`${dur(mp.fest)} festive`);
      $("payDet").textContent = parts.join(" · ");
    } else pc.hidden = true;

    renderBackupReminder(now);
    renderHistory(now);
  }

  function punchRows(k, now) {
    const arr = days[k]?.p || [];
    return arr.map((p, idx) => {
      const prev = idx > 0 ? arr[idx - 1] : null;
      const pause = prev && prev.o != null && p.i > prev.o
        ? `<div class="row pause"><div class="d">☕ Pausa ${hm(prev.o)} → ${hm(p.i)}</div><div class="d">${dur(p.i - prev.o)}</div></div>` : "";
      return pause + `
      <div class="row">
        <div><div class="t">${hm(p.i)} → ${p.o != null ? hm(p.o) : '<span class="live">in corso</span>'}</div>
             <div class="d">${dur(punchMs(p, now))}</div></div>
        <button class="edit" data-k="${k}" data-i="${idx}">Modifica</button>
      </div>`;
    }).join("");
  }

  function renderHistory(now) {
    const keys = Object.keys(days).filter(hasData).sort().reverse();
    const months = [...new Set([dayKey(new Date()).slice(0, 7), ...keys.map(k => k.slice(0, 7))])].sort().reverse();
    if (!months.includes(selMonth)) selMonth = months[0];
    $("months").innerHTML = months.map(m => `<button data-m="${m}" class="${m === selMonth ? "sel" : ""}">${esc(fmtMonth(m))}</button>`).join("");

    const list = keys.filter(k => k.startsWith(selMonth));
    const sm = monthStats(selMonth, now);
    let tot = list.length ? `Totale ${fmtMonth(selMonth)}: ${dur(sm.worked)} lavorate in ${list.filter(k => days[k].p.length).length} giorni` : "";
    const absTxt = Object.entries(sm.abs).map(([t, ms]) => `${ABS[t].toLowerCase()} ${dur(ms)}`).join(", ");
    if (absTxt) tot += ` · ${absTxt}`;
    if (list.length && Number(settings.pay) > 0) tot += ` · stima ${eur.format(sm.total)}`;
    $("histTot").textContent = tot;
    $("chart").innerHTML = list.length ? chartHTML(selMonth, now) : "";
    if (!list.length) { $("history").innerHTML = `<div class="empty">Nessuna timbratura in questo mese.</div>`; return; }
    $("history").innerHTML = list.map(k => {
      const ms = dayMs(k, now), a = absMs(k), tg = targetFor(k), d = days[k];
      const cls = !tg ? (ms ? "over" : "") : ms + a >= tg ? "over" : "under";
      const tags = [holidayName(k) ? `🇮🇹 ${esc(holidayName(k))}` : "", d.t ? `${ABS_ICON[d.t]} ${ABS[d.t]} ${num1(d.h)}h` : "", d.n ? "📝" : ""].filter(Boolean).join(" · ");
      const absRow = d.t ? `<div class="row"><div><div class="t">${ABS_ICON[d.t]} ${ABS[d.t]}</div><div class="d">${num1(d.h)}h pagate</div></div><button class="edit" data-abs="${k}">Modifica</button></div>` : "";
      const noteRow = d.n ? `<div class="row note"><div class="d" style="white-space:pre-wrap">📝 ${esc(d.n)}</div></div>` : "";
      return `<div class="day ${openDays.has(k) ? "open" : ""}" data-day="${k}">
        <div class="day-h" data-toggle="${k}"><span class="n">${esc(fmtDay(k))}${tags ? `<small class="tags">${tags}</small>` : ""}</span><span class="tot ${cls}">${dur(ms + a)}</span></div>
        <div class="day-b">${absRow}${punchRows(k, now)}${noteRow}
          <div class="day-actions"><button class="link" data-note="${k}">📝 ${d.n ? "Modifica nota" : "Aggiungi nota"}</button></div></div>
      </div>`;
    }).join("");
  }

  // grafico del mese: una barra per giorno (ore lavorate + assenze), linea dell'obiettivo
  function chartHTML(month, now) {
    const first = keyToDate(month + "-01"), n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const vals = [];
    for (let d = 1; d <= n; d++) { const k = `${month}-${pad(d)}`; vals.push({ k, w: days[k] ? dayMs(k, now) : 0, a: absMs(k), tg: targetFor(k) }); }
    const max = Math.max(3600000 * 4, ...vals.map(v => Math.max(v.w + v.a, v.tg)));
    const today = dayKey(new Date());
    return `<div class="chart">${vals.map((v, i) => {
      const hw = v.w / max * 100, ha = v.a / max * 100, over = v.w > 0 && v.w + v.a > v.tg;
      return `<div class="cb${v.k === today ? " today" : ""}" title="${esc(fmtDay(v.k))}: ${dur(v.w + v.a)}">
        <div class="cs"><div class="ca" style="height:${ha}%"></div><div class="cw${over ? " over" : ""}" style="height:${hw}%"></div>${v.tg ? `<div class="ct" style="bottom:${v.tg / max * 100}%"></div>` : ""}</div>
        <div class="cl">${(i + 1) % 5 === 0 || i === 0 ? i + 1 : ""}</div></div>`;
    }).join("")}</div>`;
  }

  // ---------- sheets (edit / add / settings) ----------
  const veil = $("veil"), sheet = $("sheet");
  const closeSheet = () => veil.classList.remove("show");
  veil.addEventListener("click", e => { if (e.target === veil) closeSheet(); });
  const tsFrom = (dateStr, timeStr) => { const [y,m,d] = dateStr.split("-").map(Number); const [h,mi] = timeStr.split(":").map(Number); return new Date(y, m-1, d, h, mi).getTime(); };

  function openPunchSheet(k, idx, forgot) {
    const editing = k != null;
    const p = editing ? days[k].p[idx] : null;
    const dateVal = editing ? k : dayKey(new Date());
    sheet.innerHTML = `
      <h3>${forgot ? "A che ora sei uscito?" : editing ? "Modifica timbratura" : "Aggiungi"}</h3>
      ${!editing ? `<div class="seg" style="margin-bottom:14px"><button class="sel">Turno di lavoro</button><button id="toAbs">Ferie / assenza</button></div>` : ""}
      ${forgot ? `<div class="sub" style="margin-bottom:12px">Il turno iniziato ${esc(fmtDay(k))} alle ${hm(days[k].p[idx].i)} non è mai stato chiuso.</div>` : ""}
      <div class="field"><label>Giorno</label><input type="date" id="fDate" value="${dateVal}"></div>
      <div class="field"><label>Entrata</label><input type="time" id="fIn" value="${p ? hm(p.i) : "09:00"}"></div>
      <div class="field"><label>Uscita ${editing && p.o == null ? "(vuoto = turno ancora in corso)" : ""}</label><input type="time" id="fOut" value="${p ? (p.o != null ? hm(p.o) : "") : "18:00"}"></div>
      <div class="err" id="fErr"></div>
      <div class="btns">
        ${editing ? '<button class="btn d" id="fDel">Elimina</button>' : ""}
        <button class="btn s" id="fCancel">Annulla</button>
        <button class="btn p" id="fSave">Salva</button>
      </div>`;
    veil.classList.add("show");
    $("fCancel").onclick = closeSheet;
    if (!editing) $("toAbs").onclick = () => openAbsenceSheet(null);
    if (editing) {
      let armed = false;
      $("fDel").onclick = async () => {
        if (!armed) { armed = true; $("fDel").textContent = "Conferma"; return; }
        days[k].p.splice(idx, 1);
        closeSheet(); render(); toast("Timbratura eliminata");
        try { await store.writeDay(k); } catch (e) { toast("Errore nel salvataggio"); }
      };
    }
    $("fSave").onclick = async () => {
      const date = $("fDate").value, tin = $("fIn").value, tout = $("fOut").value;
      if (!date || !tin) { $("fErr").textContent = "Inserisci giorno e ora di entrata."; return; }
      if (forgot && !tout) { $("fErr").textContent = "Inserisci l'ora in cui sei uscito."; return; }
      const i = tsFrom(date, tin);
      let o = null;
      if (tout) {
        o = tsFrom(date, tout);
        if (o <= i) { const nd = keyToDate(date); nd.setDate(nd.getDate() + 1); o = tsFrom(dayKey(nd), tout); } // turno a cavallo della mezzanotte (giusto anche col cambio dell'ora)
        if (o - i > MAX_SHIFT) { $("fErr").textContent = `Turno di ${dur(o - i)}: controlla gli orari (uscita prima dell'entrata?).`; return; }
        if (o > Date.now() + 60000) { $("fErr").textContent = "L'uscita non può essere nel futuro."; return; }
      }
      else {
        const other = findOpen();
        if (other && !(editing && other.k === k && other.idx === idx)) { $("fErr").textContent = "C'è già un turno in corso: inserisci l'ora di uscita."; return; }
        if (i > Date.now()) { $("fErr").textContent = "L'entrata non può essere nel futuro."; return; }
      }
      const end = o ?? Date.now();
      for (const dk of Object.keys(days)) {
        for (let j = 0; j < days[dk].p.length; j++) {
          if (editing && dk === k && j === idx) continue;
          const q = days[dk].p[j], qe = q.o ?? Date.now();
          if (i < qe && q.i < end) { $("fErr").textContent = `Si sovrappone al turno ${hm(q.i)} → ${q.o != null ? hm(q.o) : "in corso"} di ${fmtDay(dk)}.`; return; }
        }
      }
      const touched = new Set([date]);
      if (editing) { days[k].p.splice(idx, 1); touched.add(k); }
      days[date] = days[date] || { p: [] };
      days[date].p.push({ i, o });
      sortPunches(days[date].p);
      openDays.add(date); selMonth = date.slice(0, 7);
      closeSheet(); render(); toast("Salvato");
      try { for (const t of touched) await store.writeDay(t); } catch (e) { toast("Errore nel salvataggio"); }
    };
  }

  // ---------- ferie, malattia, permessi, festivi ----------

    sheet.innerHTML = `

      <div class="field"><label>Tipo</label><div class="seg" id="aType">${Object.keys(ABS).map(t => `<button data-a="${t}">${ABS_ICON[t]} ${ABS[t]}</button>`).join("")}</div></div>
      <div class="two">
        <div class="field"><label>${editing ? "Giorno" : "Dal"}</label><input type="date" id="aFrom" value="${d0}" ${editing ? "disabled" : ""}></div>

      sheet.querySelectorAll("#aType button").forEach(b => b.classList.toggle("sel", b.dataset.a === type));
      $("aHint").textContent = type === "permesso" ? "Permesso: scrivi le ore (es. 2 o 1,5)." :

    };

    $("aType").onclick = e => { const b = e.target.closest("[data-a]"); if (b) { type = b.dataset.a; paint(); } };

    $("aCancel").onclick = closeSheet;
    if (editing) {
      let armed = false;
      $("aDel").onclick = () => {
        if (!armed) { armed = true; $("aDel").textContent = "Conferma"; return; }
        delete days[k].t; delete days[k].h; store.save(); closeSheet(); render(); toast("Assenza eliminata");
      };
    }
    $("aSave").onclick = () => {
      const from = $("aFrom").value, to = editing ? from : ($("aTo").value || from);
      if (!from) { $("aErr").textContent = "Scegli il giorno."; return; }
      if (to < from) { $("aErr").textContent = "La data finale è prima di quella iniziale."; return; }
      const raw = String($("aH").value).trim().replace(",", ".");
      const hIn = raw === "" ? null : parseFloat(raw);
      if (hIn !== null && (isNaN(hIn) || hIn <= 0 || hIn > 24)) { $("aErr").textContent = "Ore non valide (es. 8 o 2,5)."; return; }
      if (type === "permesso" && hIn === null) { $("aErr").textContent = "Per il permesso scrivi quante ore."; return; }
      const list = [];
      for (const d = keyToDate(from); dayKey(d) <= to; d.setDate(d.getDate() + 1)) {
        const dk = dayKey(d);
        if (from !== to && !dayTargetH(dk) && type !== "festivo") continue; // salta riposi e festivi nei periodi
        list.push(dk);
        if (list.length > 62) { $("aErr").textContent = "Periodo troppo lungo (massimo 2 mesi)."; return; }
      }
      if (!list.length) { $("aErr").textContent = "Nel periodo ci sono solo giorni di riposo."; return; }
      for (const dk of list) {
        const h = hIn ?? dayTargetH(dk) ?? 0;
        days[dk] = days[dk] || { p: [] };
        days[dk].t = type; days[dk].h = h || (Number(settings.target) || 8);
      }
      openDays.add(list[0]); selMonth = list[0].slice(0, 7);
      store.save(); closeSheet(); render();
      toast(list.length > 1 ? `${ABS[type]}: ${list.length} giorni salvati` : `${ABS[type]} salvato`);
    };
  }

  // ---------- file Excel (.xlsx) creato direttamente nell'app ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zipStore(files) {
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nm.length, 2], [28, 0, 2]]
        .forEach(([o, v, n]) => n === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
      parts.push(new Uint8Array(lh.buffer), nm, data);
      const ch = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4],
       [28, nm.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
        .forEach(([o, v, n]) => n === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
      central.push(new Uint8Array(ch.buffer), nm);
      off += 30 + nm.length + data.length;
    }
    const size = central.reduce((a, c) => a + c.length, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }
  const xmlEsc = v => String(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const colL = i => String.fromCharCode(65 + i);
  // celle: numero → valore; {d:"YYYY-MM-DD"} → data; {h:ore} → ore decimali; {e:euro}; {b:"testo"} → grassetto; stringa → testo
  function sheetXML(rows, widths) {
    const serial = k => { const [y, m, d] = k.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000; };
    const cell = (v, r, c) => {
      const ref = colL(c) + r;
      if (v == null || v === "") return "";
      if (typeof v === "number") return `<c r="${ref}"><v>${v}</v></c>`;
      if (v.d) return `<c r="${ref}" s="2"><v>${serial(v.d)}</v></c>`;
      if (v.h != null) return `<c r="${ref}" s="3"><v>${Math.round(v.h * 100) / 100}</v></c>`;
      if (v.e != null) return `<c r="${ref}" s="4"><v>${Math.round(v.e * 100) / 100}</v></c>`;
      if (v.b != null) return `<c r="${ref}" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v.b)}</t></is></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    };
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
      `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
      `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>` +
      rows.map((row, ri) => `<row r="${ri + 1}">${row.map((v, ci) => cell(v, ri + 1, ci)).join("")}</row>`).join("") + `</sheetData></worksheet>`;
  }
  function buildXlsx(month) {
    const now = Date.now(), H = 3600000, keys = Object.keys(days).filter(k => k.startsWith(month) && hasData(k)).sort();
    const r1 = [[{ b: "Data" }, { b: "Giorno" }, { b: "Tipo" }, { b: "Entrata" }, { b: "Uscita" }, { b: "Ore" }, { b: "Note" }]];
    const wd = k => keyToDate(k).toLocaleDateString("it-IT", { weekday: "long" });
    for (const k of keys) {
      const d = days[k];
      if (d.t) r1.push([{ d: k }, wd(k), ABS[d.t], "", "", { h: d.h }, d.n || ""]);
      d.p.forEach((p, i) => { const e = eff(p, now);
        r1.push([{ d: k }, wd(k), isFestive(k) ? "Lavoro (festivo)" : "Lavoro", hm(e.i), p.o != null ? hm(e.o) : "in corso", { h: punchMs(p, now) / H }, !d.t && i === 0 ? d.n || "" : ""]); });
      if (!d.t && !d.p.length && d.n) r1.push([{ d: k }, wd(k), "Nota", "", "", "", d.n]);
    }

  function buildMonthText(month) {
    const lines = [];
    Object.keys(days).filter(k => k.startsWith(month) && days[k].p.length).sort().forEach(k => {
      days[k].p.forEach(p => { const e = eff(p, Date.now()); lines.push(`${k};${hm(e.i)};${p.o != null ? hm(e.o) : ""}`); });
    });
    return lines.join("\n");
  }
  async function shareFile(filename, text, mime) {
    const file = new File([text], filename, { type: mime }); // text può essere testo o Blob
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return true;
      }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    try {
      const url = URL.createObjectURL(file);
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return true;
    } catch (e) { toast("Esportazione non riuscita"); return false; }
  }

      if (!r.ok) return;
      const j = await r.json();
      if (j && typeof j.version === "string" && newer(j.version, APP_VERSION)) {
        $("updTxt").textContent = `Versione ${j.version}` + (j.note ? ` · ${j.note}` : "");
        $("updBar").hidden = false;
        $("updBtn").onclick = () => { location.replace(location.pathname + "?v=" + encodeURIComponent(j.version)); };
        if (manual) { closeSheet(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      } else if (manual) toast(`Hai già l'ultima versione (${APP_VERSION})`);
    } catch (e) { if (manual) toast("Nessuna connessione, riprova più tardi"); }
  }
  setInterval(checkUpdate, 30 * 60000);

  // ---------- events ----------
  $("punchBtn").onclick = punch;
  $("addBtn").onclick = () => openPunchSheet(null, null);
  $("settingsBtn").onclick = openSettings;
  $("exportBtn").onclick = openExport;
  $("backupBtn").onclick = openBackup;
  $("infoBtn").onclick = openInfo;
  $("verChk").onclick = () => checkUpdate(true);
  document.addEventListener("click", e => {
    const ab = e.target.closest("[data-abs]");
    if (ab) { openAbsenceSheet(ab.dataset.abs); return; }
    const nt = e.target.closest("[data-note]");
    if (nt) { openNoteSheet(nt.dataset.note); return; }
    const ed = e.target.closest(".edit[data-k]");
    if (ed) { openPunchSheet(ed.dataset.k, Number(ed.dataset.i)); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg) { const k = tg.dataset.toggle; openDays.has(k) ? openDays.delete(k) : openDays.add(k); render(); return; }
    const mb = e.target.closest("[data-m]");
    if (mb) { selMonth = mb.dataset.m; render(); }
  });

  // ---------- clock ----------
  function tick() {
    const n = new Date();
    $("clock").textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
    $("today").textContent = n.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long" });
  }
  tick(); render();
  setInterval(() => { tick(); if (!veil.classList.contains("show")) render(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); render(); checkUpdate(); } });
  checkUpdate();

  initStore();
  checkWhatsNew();
  // funzionamento offline
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
  // niente zoom (Safari su iPhone ignora user-scalable=no, quindi si bloccano anche i gesti)
  ["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
